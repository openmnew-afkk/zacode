<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zenova-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06050a" />
    <meta name="description" content="ZENOVA — фильмы, сериалы и музыка в одном приложении" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ZENOVA — Кино и Музыка</title>
    <style>
      html, body { background: #06050a; margin: 0; padding: 0; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#06050a;color:rgba(255,255,255,0.4);font-family:-apple-system,BlinkMacSystemFont,sans-serif">
        <div style="width:28px;height:28px;border-radius:50%;border:2px solid rgba(168,85,247,0.2);border-top-color:#a855f7;animation:auraspin 0.8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes auraspin{to{transform:rotate(360deg)}}</style>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
